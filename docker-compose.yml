# Self-hosted deployment, built from this checkout:
#
#   docker compose up -d --build
#
# Upgrade:  git pull && docker compose up -d --build
# Logs:     docker compose logs -f
# Backup:   docker run --rm -v aperturekit_data:/data -v "$PWD":/backup alpine \
#             tar czf /backup/aperturekit-backup.tgz -C /data .
#
# Optional settings go in a `.env` file next to this one (see .env.example).
#
# Built-in HTTPS: set DOMAIN, TRUST_PROXY=1, BIND_ADDRESS=127.0.0.1 and
# COMPOSE_PROFILES=https in `.env` and the `caddy` service below starts too,
# fetching a Let's Encrypt certificate for DOMAIN on ports 80 and 443.

services:
  aperturekit:
    build: .
    image: aperturekit
    container_name: aperturekit
    restart: unless-stopped
    init: true
    ports:
      # With TRUST_PROXY=1 the portal believes X-Forwarded-For, so it must
      # only be reachable through the proxy: set BIND_ADDRESS=127.0.0.1 (the
      # https profile below talks to it over the Compose network regardless).
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      # Set to 1 when a reverse proxy (Caddy, nginx, Traefik) terminates TLS
      # in front of this container; also marks session cookies Secure.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      # Optional. If unset, a secret is generated once and kept in the volume.
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      # Database, uploads, and session secret. To use a host directory
      # instead, replace with `./data:/data` and `chown -R 1000:1000 ./data`.
      - data:/data

  # Only started with the `https` profile (COMPOSE_PROFILES=https in .env).
  # Terminates TLS for DOMAIN with an automatic Let's Encrypt certificate;
  # DOMAIN must already point at this host and ports 80/443 must be open.
  caddy:
    image: caddy:2-alpine
    container_name: aperturekit-caddy
    profiles: [https]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    command:
      - sh
      - -c
      - >-
        [ -n "$$DOMAIN" ] || { echo "Set DOMAIN in .env for the https profile"; exit 1; };
        exec caddy reverse-proxy --from "$$DOMAIN" --to aperturekit:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificates and ACME account; keep it to avoid re-issuing on restart.
      - caddy:/data
    depends_on:
      - aperturekit

volumes:
  data:
  caddy:
